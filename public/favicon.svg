<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0d1b2e"/>

  <!-- Anchor -->
  <g fill="none" stroke="#4fc3f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top crossbar -->
    <line x1="20" y1="20" x2="44" y2="20"/>
    <!-- Vertical shaft -->
    <line x1="32" y1="20" x2="32" y2="52"/>
    <!-- Ring at top -->
    <circle cx="32" cy="14" r="5" stroke="#f0a500" stroke-width="3"/>
    <!-- Left curve at bottom -->
    <path d="M 32 52 Q 16 52 16 40"/>
    <!-- Right curve at bottom -->
    <path d="M 32 52 Q 48 52 48 40"/>
    <!-- Left foot -->
    <line x1="16" y1="36" x2="16" y2="44"/>
    <!-- Right foot -->
    <line x1="48" y1="36" x2="48" y2="44"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
</svg>
